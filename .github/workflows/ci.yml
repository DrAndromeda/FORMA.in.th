name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    name: Site (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This project has no lint/test script (package.json's "scripts" block
      # is dev/build/preview/astro/check) — `check` is Astro's own type
      # checker across .astro files. Add lint/test steps here if/when this
      # repo gains that tooling; don't invent commands that don't exist.
      - run: npm run check
      - run: npm run build

  bots:
    name: Bots (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bots/package-lock.json
      - working-directory: bots
        run: npm ci
      - working-directory: bots
        run: npm run typecheck
