name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Add /FORMA.in.th/ prefix to internal links
        run: |
          cd dist
          # Fix href links in all HTML files
          find . -name '*.html' -exec sed -i \
            -E 's|href="/FORMA\.in\.th/|href="/FORMA.in.th/|g; s|href="/([a-z][a-z0-9_-]*(/|$|\?))|href="/FORMA.in.th/\1|g; s|src="/([a-z][a-z0-9_-])|src="/FORMA.in.th/\1|g' {} +
          # But don't break external URLs, anchors, or protocol links
          find . -name '*.html' -exec sed -i \
            -E 's|href="/FORMA\.in\.th/(https?:)|href="/\1|g; s|href="/FORMA\.in\.th/#|href="/#|g' {} +
          echo "Fixed internal links in HTML files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
