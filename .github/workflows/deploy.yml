name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Add /FORMA.in.th/ prefix to internal links
        run: |
          cd dist
          # Use # as sed delimiter (avoids conflict with / and | in patterns)
          # Only prefix hrefs on lines that don't already have FORMA.in.th
          # (to avoid double-prefixing already correct asset paths)
          find . -name '*.html' -exec sed -i -E \
            '/FORMA\.in\.th/!s#href="/#href="/FORMA.in.th/#g' {} +
          echo "Fixed internal links in HTML files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
