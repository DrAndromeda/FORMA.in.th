name: Project status sync

# Guaranteed alternative to the Project's own built-in Workflows automation
# (see docs/WORKFLOW.md §4) — moves a linked issue's board Status to
# "In Test" when its PR opens and "Done" when it merges, by parsing a
# closing keyword (Closes/Fixes/Resolves — not "Part of", which is
# deliberately informational only, see docs/WORKFLOW.md §6) out of the PR
# body.
#
# Requires a PROJECT_TOKEN secret: a classic PAT with `repo` + `project`
# scopes. The default GITHUB_TOKEN cannot write to Projects v2.
#
# Note (from forked-repo PRs): GitHub does not expose repository secrets to
# workflows triggered by a pull_request from a fork, by design. This
# workflow will fail loudly (see the guard step below) for such PRs unless
# your org's settings say otherwise — that's expected, not a bug here.

on:
  pull_request:
    types: [opened, ready_for_review, closed]

permissions:
  contents: read

env:
  PROJECT_OWNER: "@me"
  PROJECT_TITLE: "FORMA Roadmap"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require PROJECT_TOKEN
        run: |
          if [ -z "${{ secrets.PROJECT_TOKEN }}" ]; then
            echo "::error::PROJECT_TOKEN secret is not set — this workflow cannot update the Project board without it. See docs/WORKFLOW.md §4 for how to create and add it."
            exit 1
          fi

      - name: Determine target status
        id: target
        run: |
          set -euo pipefail
          if [[ "${{ github.event.action }}" == "closed" ]]; then
            if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
              echo "PR closed without merging — not touching the board."
              echo "status=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "status=Done" >> "$GITHUB_OUTPUT"
          else
            echo "status=In Test" >> "$GITHUB_OUTPUT"
          fi

      - name: Update linked issue(s) on the board
        if: steps.target.outputs.status != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # The PR body is passed through as an env var and referenced below
          # as "$PR_BODY" — deliberately NOT interpolated as
          # ${{ github.event.pull_request.body }} directly into this `run:`
          # script. A PR body is attacker-controlled text; interpolating it
          # straight into shell source is a script-injection vector (a
          # crafted body could break out of the string and run arbitrary
          # commands in this job). Consuming it only as a variable's *value*
          # is what makes this safe.
          PR_BODY: ${{ github.event.pull_request.body }}
          TARGET_STATUS: ${{ steps.target.outputs.status }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Closing keywords only — "Part of #N" is intentionally excluded
          # from board automation (see docs/WORKFLOW.md §6); it's still
          # logged below for visibility.
          mapfile -t closing_issues < <(
            grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' <<<"$PR_BODY" \
              | grep -oE '[0-9]+' | sort -u
          )
          mapfile -t partial_issues < <(
            grep -oiE 'part of[[:space:]]+#[0-9]+' <<<"$PR_BODY" \
              | grep -oE '[0-9]+' | sort -u
          )

          for n in "${partial_issues[@]:-}"; do
            [[ -n "$n" ]] && echo "PR is 'Part of #$n' — informational only, not moving its board status."
          done

          if [[ ${#closing_issues[@]} -eq 0 ]]; then
            echo "No 'Closes/Fixes/Resolves #N' reference found in the PR body — nothing to update."
            exit 0
          fi

          project_num="$(gh project list --owner "$PROJECT_OWNER" --format json --limit 100 \
            --jq ".projects[] | select(.title == \"$PROJECT_TITLE\") | .number" | head -n1)"

          if [[ -z "$project_num" ]]; then
            echo "::error::No project titled \"$PROJECT_TITLE\" found for owner $PROJECT_OWNER."
            exit 1
          fi

          for n in "${closing_issues[@]}"; do
            url="https://github.com/$REPO/issues/$n"
            echo "Setting #$n → $TARGET_STATUS"
            if ! gh project item-edit "$project_num" --owner "$PROJECT_OWNER" \
                --url "$url" --field "Status" --value "$TARGET_STATUS"; then
              echo "::warning::Could not update #$n — it may not be on the board yet, or the Status field's options haven't been renamed per docs/WORKFLOW.md §3 yet."
            fi
          done
